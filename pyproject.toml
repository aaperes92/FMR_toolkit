[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmrtoolkit"
version = "0.1.0"
description = "Herramientas de análisis y cálculo de FMR"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Tu nombre" },
    { name = "Nombre de tu compañero" },
]
license = { text = "MIT" }
dependencies = ["numpy", "scipy", "matplotlib", "sympy"]

[tool.setuptools.packages.find]
include = ["fmrtoolkit*"]